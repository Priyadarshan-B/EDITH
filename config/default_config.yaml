# EDITH System Configuration

app:
  name: "EDITH"
  version: "0.1.0"
  environment: "development"
  debug: true

server:
  host: "127.0.0.1"
  port: 18420
  workers: 1
  cors_origins:
    - "http://localhost:1420"
    - "http://127.0.0.1:1420"
    - "tauri://localhost"

models:
  primary_provider: "ollama"
  local:
    routing_model: "qwen2.5:3b"
    complex_model: "qwen2.5:7b"
    ollama_base_url: "http://127.0.0.1:11434"
    context_window: 4096
    temperature: 0.7
  cloud:
    enabled: false
    provider: "gemini"
    api_key_env_var: "GEMINI_API_KEY"
    model: "gemini-1.5-flash"

voice:
  wake_word:
    enabled: true
    model_name: "hey_edith"
    threshold: 0.75
    inference_framework: "onnx"
  vad:
    threshold: 0.5
    min_silence_duration_ms: 600
  stt:
    provider: "faster-whisper"
    model_size: "base.en"
    compute_type: "int8"
    language: "en"
  tts:
    provider: "piper"
    voice_name: "en_US-lessac-medium"
    speed: 1.0
    volume: 1.0
  audio:
    sample_rate: 16000
    channels: 1
    chunk_size: 1280

database:
  sqlite_path: "data/edith.db"
  chroma_persist_dir: "data/chroma"
  embedding_model: "all-MiniLM-L6-v2"

security:
  strict_jailing: true
  allowed_roots:
    - "%USERPROFILE%"
    - "c:\\Projects"
  require_voice_confirmation_for_sensitive: true
  require_gui_confirmation_for_destructive: true

system:
  telemetry_interval_seconds: 2
  hardware_mode: "auto"  # auto, cpu, cuda
