[package]
name = "edith-desktop"
version = "0.1.0"
description = "EDITH - Personal AI Operating Assistant"
edition = "2021"

[lib]
name = "edith_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon"] }
tauri-plugin-shell = "2.2"
tauri-plugin-global-shortcut = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }

